name: Python Service Tests

on:
  push:
    branches: [ main, phase2-python-service ]
    paths:
      - 'python-service/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main, phase2-python-service ]
    paths:
      - 'python-service/**'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test Python Service
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'python-service/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-service/requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          # Check for syntax errors and undefined names
          ruff check python-service/ --select=E9,F63,F7,F82 --output-format=full
          # Run full linting (exit-zero treats all errors as warnings)
          ruff check python-service/ --exit-zero --output-format=full

      - name: Check code formatting with ruff
        run: |
          ruff format python-service/ --check

      - name: Run tests with pytest
        run: |
          cd python-service
          pytest -v \
            test_snmp_poller.py \
            test_icmp_poller.py \
            test_database_writer.py \
            test_subnet_reader.py \
            test_event_listener.py \
            test_metrics.py \
            test_main_metrics.py

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Python version: 3.12" >> $GITHUB_STEP_SUMMARY
          echo "- Test files: 7 (Steps 2-6, Phase 3 Step 1)" >> $GITHUB_STEP_SUMMARY
          echo "- All tests use mocked dependencies (no Docker/MySQL required)" >> $GITHUB_STEP_SUMMARY
