[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/php-fpm-stdout.log
stderr_logfile=/var/log/supervisor/php-fpm-stderr.log

[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --timeout=300
autostart=true
autorestart=true
stopwaitsecs=3600
priority=15
user=www-data
stdout_logfile=/var/log/supervisor/queue-worker-stdout.log
stderr_logfile=/var/log/supervisor/queue-worker-stderr.log

[program:scheduler]
command=/bin/sh -c "while [ true ]; do (php /var/www/html/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
autostart=true
autorestart=true
priority=20
user=www-data
stdout_logfile=/var/log/supervisor/scheduler-stdout.log
stderr_logfile=/var/log/supervisor/scheduler-stderr.log
