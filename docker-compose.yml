services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-monitoring-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor-data:/var/www/html/vendor
      - node-modules-data:/var/www/html/node_modules
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - network-monitoring

  nginx:
    image: nginx:alpine
    container_name: network-monitoring-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/http.d/default.conf
    depends_on:
      - php
    networks:
      - network-monitoring

  mysql:
    image: mysql:8.0
    container_name: network-monitoring-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-network_monitoring}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - network-monitoring
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: network-monitoring-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - network-monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  node:
    image: node:20-alpine
    container_name: network-monitoring-node
    working_dir: /app
    volumes:
      - .:/app
      - node-modules-data:/app/node_modules
    command: sh -c "npm install && npm run build"
    networks:
      - network-monitoring

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: network-monitoring-python
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=network-discovery-service
      - SERVICE_VERSION=1.0.0
      - DEBUG=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-network_monitoring}
      - DB_USERNAME=${DB_USERNAME:-laravel_user}
      - DB_PASSWORD=${DB_PASSWORD:-laravel_password}
      - SERVICE_PORT=8000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - network-monitoring
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: network-monitoring-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - network-monitoring

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: network-monitoring-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_password}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - network-monitoring

networks:
  network-monitoring:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  vendor-data:
    driver: local
  node-modules-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
