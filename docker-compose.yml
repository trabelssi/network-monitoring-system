services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: network-monitoring-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor-data:/var/www/html/vendor
      - node-modules-data:/var/www/html/node_modules
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - network-monitoring

  nginx:
    image: nginx:alpine
    container_name: network-monitoring-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/http.d/default.conf
    depends_on:
      - php
    networks:
      - network-monitoring

  mysql:
    image: mysql:8.0
    container_name: network-monitoring-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-network_monitoring}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-laravel_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - network-monitoring
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: network-monitoring-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - network-monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  node:
    image: node:20-alpine
    container_name: network-monitoring-node
    working_dir: /app
    volumes:
      - .:/app
      - node-modules-data:/app/node_modules
    command: sh -c "npm install && npm run build"
    networks:
      - network-monitoring

networks:
  network-monitoring:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  vendor-data:
    driver: local
  node-modules-data:
    driver: local
